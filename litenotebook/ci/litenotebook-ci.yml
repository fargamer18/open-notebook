# LiteNotebook CI — Linux + Windows matrix (NOT active yet).
#
# Why it lives here: this repository still hosts the legacy Open Notebook
# project, whose own workflows are in /.github/workflows. Adding a workflow
# there changes the inherited repo's CI, so this file is kept inside
# litenotebook/ until LiteNotebook gets its own repository (or you decide to
# enable it here). To activate: copy it to .github/workflows/litenotebook.yml.
#
# Model- and LLM-dependent tests skip themselves automatically: the MiniLM
# cache is absent on CI runners (pytest marker "model") and
# LITENOTEBOOK_TEST_LLM is not set (marker "llm"). No model is downloaded:
# HF_HUB_OFFLINE stays on. Browser checks are not part of pytest.
# PYTHONUTF8 is deliberately NOT set, so Windows runs with its legacy code
# page and catches any text I/O that forgets encoding="utf-8".

name: LiteNotebook

on:
  push:
    paths: ["litenotebook/**"]
  pull_request:
    paths: ["litenotebook/**"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: litenotebook
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install (CPU-only torch, locked)
        run: uv sync --frozen
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Mypy
        run: uv run mypy --strict src
      - name: Pytest
        run: uv run pytest -q
